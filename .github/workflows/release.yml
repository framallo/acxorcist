name: release

# Build prebuilt, self-contained acxorcist binaries and attach them to the
# GitHub Release on a v* tag. Asset names must stay acxorcist-<target>.tar.gz
# (install.sh depends on them). libmp3lame is compiled in via mp3lame-sys, which
# needs autotools at build time.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps (autotools for libmp3lame)
        run: brew install autoconf automake libtool
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --bin acxorcist --target ${{ matrix.target }}
      - name: Package
        run: |
          tar -C target/${{ matrix.target }}/release -czf acxorcist-${{ matrix.target }}.tar.gz acxorcist
          shasum -a 256 acxorcist-${{ matrix.target }}.tar.gz > acxorcist-${{ matrix.target }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            acxorcist-${{ matrix.target }}.tar.gz
            acxorcist-${{ matrix.target }}.tar.gz.sha256

  linux:
    # Native runners per arch (ARM64 runner avoids cross-compiling the libmp3lame
    # C build). GitHub provides ubuntu-24.04-arm free for public repos.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps (autotools for libmp3lame)
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool build-essential
      - run: cargo build --release --bin acxorcist --target ${{ matrix.target }}
      - name: Package
        run: |
          tar -C target/${{ matrix.target }}/release -czf acxorcist-${{ matrix.target }}.tar.gz acxorcist
          sha256sum acxorcist-${{ matrix.target }}.tar.gz > acxorcist-${{ matrix.target }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            acxorcist-${{ matrix.target }}.tar.gz
            acxorcist-${{ matrix.target }}.tar.gz.sha256
